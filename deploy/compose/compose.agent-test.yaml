# Test-only overlay that adds the containerized Ubuntu Agent to the default
# backend Compose. This profile is used exclusively for automated E2E and the
# fully-containerized LAN closed loop. The production default Compose must
# never start the Agent; on real Ubuntu hosts the Agent is installed via the
# .deb and managed by systemd.
#
# Usage:
#   docker compose -f compose.yaml -f compose.agent-test.yaml up -d --build --wait
services:
  agent:
    image: "${IMAGE_PREFIX:-share-disk}/agent:${IMAGE_TAG:-latest}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: agent
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SHARE_DISK_SQLITE_PATH: /var/lib/share-disk/agent.db
      SHARE_DISK_STORAGE_ROOT: /var/lib/share-disk/objects
      SHARE_DISK_AGENT_SOCKET: /var/lib/share-disk/agent.sock
      SHARE_DISK_SQLITE_MIGRATIONS_DIR: /app/migrations/sqlite
      SHARE_DISK_LAN_ENABLED: "true"
      SHARE_DISK_LAN_HOST: 0.0.0.0
      SHARE_DISK_LAN_PORT: 9090
      SHARE_DISK_LAN_MAX_UPLOAD_SIZE: ${LAN_MAX_UPLOAD_SIZE:-10737418240}
      SHARE_DISK_ACCESS_PUBLIC_KEY_FILE: /run/secrets/access_public_key
      SHARE_DISK_LOG_FORMAT: json
      SHARE_DISK_LOG_OUTPUT: stdout
    secrets:
      - access_public_key
    volumes:
      - agent_data:/var/lib/share-disk
    networks:
      - edge
    ports:
      - "${LAN_AGENT_BIND_ADDRESS:-127.0.0.1}:${LAN_AGENT_PORT:-9090}:9090"
    stop_grace_period: 20s

volumes:
  agent_data:

secrets:
  access_public_key:
    file: ${ACCESS_PUBLIC_KEY_FILE:-../../conf/.runtime/access_public_key.pem}
