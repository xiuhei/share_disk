syntax = "proto3";

package sharedisk.v1;

option go_package = "github.com/share-disk/share-disk/contracts/proto/sharedisk/v1;sharediskv1";

// LocalService defines the IPC interface between CLI/GUI and the local Agent.
// This service is exposed over Unix domain sockets (Linux) or named pipes (Windows).

// ImportRequest requests a file to be imported into the managed object area.
message ImportRequest {
  // Absolute path of the source file.
  string source_path = 1;

  // Target folder ID in the logical directory.
  string folder_id = 2;

  // Display name for the file entry.
  string name = 3;
}

// ImportResponse contains the result of an import operation.
message ImportResponse {
  // ID of the created file entry.
  string file_entry_id = 1;

  // ID of the file object.
  string file_object_id = 2;

  // SHA-256 hash of the imported file.
  bytes sha256 = 3;

  // Size of the imported file in bytes.
  uint64 size = 4;
}

// StatRequest requests information about a file or object.
message StatRequest {
  // File entry ID or logical path.
  string identifier = 1;
}

// StatResponse contains file/object information.
message StatResponse {
  // File entry information.
  FileEntry entry = 1;

  // File object information.
  FileObject object = 2;

  // Replica information.
  repeated Replica replicas = 3;
}

// FileEntry represents a logical file entry in the directory.
message FileEntry {
  string id = 1;
  string folder_id = 2;
  string name = 3;
  string object_id = 4;
  string origin_device_id = 5;
  string status = 6;
  int64 version = 7;
  string created_at = 8;
  string updated_at = 9;
}

// FileObject represents a content-addressed file object.
message FileObject {
  string id = 1;
  bytes sha256 = 2;
  uint64 size = 3;
  string mime = 4;
  uint32 chunk_size = 5;
  uint32 chunk_count = 6;
  string status = 7;
}

// Replica represents a replica of a file object on a device.
message Replica {
  string id = 1;
  string object_id = 2;
  string device_id = 3;
  string state = 4;
  uint64 size = 5;
  string verified_at = 6;
  string reported_at = 7;
  int64 version = 8;
}

// VerifyRequest requests verification of a local object.
message VerifyRequest {
  // Object ID to verify.
  string object_id = 1;
}

// VerifyResponse contains the verification result.
message VerifyResponse {
  // Whether the object is valid.
  bool valid = 1;

  // Actual SHA-256 hash (if different from expected).
  bytes actual_sha256 = 2;

  // Error message if verification failed.
  string error = 3;
}

// StatusRequest requests the current agent status.
message StatusRequest {}

// StatusResponse contains the agent status.
message StatusResponse {
  // Agent version.
  string version = 1;

  // Device ID.
  string device_id = 2;

  // Storage root path.
  string storage_root = 3;

  // Number of local objects.
  int64 object_count = 4;

  // Total storage used in bytes.
  uint64 storage_used = 5;

  // Available storage in bytes.
  uint64 storage_available = 6;

  // Active transfers.
  int32 active_transfers = 7;

  // Last sync sequence number.
  int64 last_sync_seq = 8;
}

// ListTransfersRequest requests a list of transfers.
message ListTransfersRequest {
  // Filter by status (empty means all).
  string status = 1;

  // Maximum number of results.
  int32 limit = 2;

  // Cursor for pagination.
  string cursor = 3;
}

// ListTransfersResponse contains a list of transfers.
message ListTransfersResponse {
  // List of transfers.
  repeated Transfer transfers = 1;

  // Cursor for next page.
  string next_cursor = 2;
}

// Transfer represents a transfer task.
message Transfer {
  string id = 1;
  string object_id = 2;
  string target_device_id = 3;
  string reason = 4;
  string state = 5;
  int32 priority = 6;
  string lease_owner = 7;
  string lease_until = 8;
  int32 attempt = 9;
  int64 version = 10;
  string created_at = 11;
  string updated_at = 12;
}

// CancelTransferRequest requests cancellation of a transfer.
message CancelTransferRequest {
  // Transfer ID to cancel.
  string transfer_id = 1;
}

// CancelTransferResponse contains the result of a cancel operation.
message CancelTransferResponse {
  // Whether the transfer was canceled.
  bool canceled = 1;

  // Error message if cancellation failed.
  string error = 2;
}

message LocalFileRecord {
  string id = 1;
  string name = 2;
  string mime = 3;
  uint64 size = 4;
  string sha256 = 5;
  string status = 6;
  string deleted_at = 7;
  string purge_after = 8;
}

message ListLocalFilesRequest {
  bool trash = 1;
}

message ListLocalFilesResponse {
  repeated LocalFileRecord files = 1;
}

message MutateLocalFileRequest {
  string file_id = 1;
  string action = 2;
  string name = 3;
}

message MutateLocalFileResponse {
  LocalFileRecord file = 1;
}

message ExportRequest {
  string file_id = 1;
  string destination_path = 2;
}

message ExportResponse {
  string destination_path = 1;
  uint64 size = 2;
  string sha256 = 3;
}

message CoordinatorEnrollRequest {
  string account = 1;
  string password = 2;
}

message CoordinatorEnrollResponse {
  bool provisioned = 1;
}

// LocalError describes an error returned by the local IPC service.
message LocalError {
  // Stable error code (e.g. NOT_FOUND, INVALID_REQUEST, INTERNAL).
  string code = 1;
  // Human-readable message.
  string message = 2;
}

// LocalRequest is the transport envelope for a request over the local IPC
// channel. The kind of request is determined by which payload field is set.
message LocalRequest {
  oneof payload {
    ImportRequest import = 1;
    StatRequest stat = 2;
    VerifyRequest verify = 3;
    StatusRequest status = 4;
    ListTransfersRequest list_transfers = 5;
    CancelTransferRequest cancel_transfer = 6;
    ListLocalFilesRequest list_local_files = 7;
    MutateLocalFileRequest mutate_local_file = 8;
    ExportRequest export = 9;
    CoordinatorEnrollRequest coordinator_enroll = 10;
  }
}

// LocalResponse is the transport envelope for a response over the local IPC
// channel. Exactly one of the payload fields is set; error carries failures.
message LocalResponse {
  oneof payload {
    ImportResponse import = 1;
    StatResponse stat = 2;
    VerifyResponse verify = 3;
    StatusResponse status = 4;
    ListTransfersResponse list_transfers = 5;
    CancelTransferResponse cancel_transfer = 6;
    LocalError error = 7;
    ListLocalFilesResponse list_local_files = 8;
    MutateLocalFileResponse mutate_local_file = 9;
    ExportResponse export = 10;
    CoordinatorEnrollResponse coordinator_enroll = 11;
  }
}

// LocalService is the IPC interface between CLI/GUI and the local Agent. It is
// exposed over Unix domain sockets (Linux) or named pipes (Windows). The wire
// transport is a length-prefixed protobuf stream of LocalRequest/LocalResponse
// envelopes; the RPCs below document the logical operations.
service LocalService {
  rpc Import(ImportRequest) returns (ImportResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);
  rpc CancelTransfer(CancelTransferRequest) returns (CancelTransferResponse);
  rpc ListLocalFiles(ListLocalFilesRequest) returns (ListLocalFilesResponse);
  rpc MutateLocalFile(MutateLocalFileRequest) returns (MutateLocalFileResponse);
}
