syntax = "proto3";

package sharedisk.v1;

option go_package = "github.com/share-disk/share-disk/contracts/proto/sharedisk/v1;sharediskv1";

// TransferProtocol defines the P2P transfer protocol for object chunks.
// Protocol ID: /sharedisk/object-transfer/1.0.0

// TransferOpen is sent by the target device to initiate a transfer.
message TransferOpen {
  // Protocol version for compatibility checking.
  uint32 protocol_version = 1;

  // Task ID from the control server.
  string task_id = 2;

  // Transfer ticket signed by the control server.
  bytes ticket = 3;

  // SHA-256 hash of the object to transfer.
  bytes object_hash = 4;

  // Requested chunk indices (empty means all chunks).
  repeated uint32 requested_chunks = 5;

  // Canonical manifest SHA-256 approved by the target's transfer plan.
  bytes manifest_digest = 6;
}

// TransferAccept is sent by the source device to accept a transfer request.
message TransferAccept {
  // Chunk size in bytes.
  uint32 chunk_size = 1;

  // Total object size in bytes.
  uint64 total_size = 2;

  // Manifest digest for verification.
  bytes manifest_digest = 3;

  // Available chunk indices (may be subset if source has partial object).
  repeated uint32 available_chunks = 4;
}

// TransferReject is sent by the source device to reject a transfer request.
message TransferReject {
  // Reason code for rejection.
  RejectReason reason = 1;

  // Human-readable error message.
  string message = 2;
}

// RejectReason enumerates possible rejection reasons.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_INVALID_TICKET = 1;
  REJECT_REASON_TICKET_EXPIRED = 2;
  REJECT_REASON_INVALID_PEER = 3;
  REJECT_REASON_OBJECT_NOT_FOUND = 4;
  REJECT_REASON_INVALID_HASH = 5;
  REJECT_REASON_RATE_LIMITED = 6;
  REJECT_REASON_INTERNAL_ERROR = 7;
}

// ChunkRequest is sent by the target device to request specific chunks.
message ChunkRequest {
  // Chunk index to request.
  uint32 index = 1;
}

// ChunkData is sent by the source device with chunk data.
message ChunkData {
  // Chunk index.
  uint32 index = 1;

  // Byte offset within the object.
  uint64 offset = 2;

  // Chunk data bytes.
  bytes bytes = 3;

  // SHA-256 hash of this chunk.
  bytes chunk_hash = 4;
}

// ChunkAck is sent by the target device after verifying and persisting a chunk.
message ChunkAck {
  // Chunk index that was acknowledged.
  uint32 index = 1;
}

// TransferClose is sent by either device to close the transfer.
message TransferClose {
  // Final status of the transfer.
  TransferStatus status = 1;

  // Human-readable message (optional).
  string message = 2;
}

// TransferStatus enumerates possible transfer completion statuses.
enum TransferStatus {
  TRANSFER_STATUS_UNSPECIFIED = 0;
  TRANSFER_STATUS_COMPLETED = 1;
  TRANSFER_STATUS_CANCELED = 2;
  TRANSFER_STATUS_FAILED = 3;
  TRANSFER_STATUS_SOURCE_EXHAUSTED = 4;
}

// TransferMessage wraps all possible messages in the transfer protocol.
message TransferMessage {
  oneof message {
    TransferOpen open = 1;
    TransferAccept accept = 2;
    TransferReject reject = 3;
    ChunkRequest chunk_request = 4;
    ChunkData chunk_data = 5;
    ChunkAck chunk_ack = 6;
    TransferClose close = 7;
  }
}
